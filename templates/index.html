<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🚽 Tuvalet Durumu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        .status-display {
            margin: 30px 0;
            padding: 40px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .status-display.available {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .status-display.occupied {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .status-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .status-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-info {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 15px;
        }

        .user-input {
            margin: 20px 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0;
            color: white;
        }

        .button:active {
            transform: scale(0.98);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-checkin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-checkin:hover:not(:disabled) {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-checkout {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-checkout:hover:not(:disabled) {
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .last-update {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .status-icon {
                font-size: 60px;
            }

            .status-text {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚽 MAE TOILET APP</h1>
        
        <div id="statusDisplay" class="status-display available">
            <div class="status-icon">✅</div>
            <div class="status-text">Müsait</div>
            <div class="status-info" id="statusInfo"></div>
        </div>

        <div id="checkInSection" class="user-input">
            <input type="text" id="userName" placeholder="İsminizi girin (opsiyonel)" maxlength="50">
            <button class="button btn-checkin" onclick="checkIn()">Giriş Yap</button>
        </div>

        <div id="checkOutSection" class="hidden">
            <button class="button btn-checkout" onclick="checkOut()">Çıkış Yap</button>
        </div>

        <div class="last-update">
            Son güncelleme: <span id="lastUpdate">-</span>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('toiletUser') || '';
        
        // Load status on page load
        updateStatus();
        
        // Auto-refresh every 5 seconds
        setInterval(updateStatus, 5000);

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const statusDisplay = document.getElementById('statusDisplay');
                const statusInfo = document.getElementById('statusInfo');
                const checkInSection = document.getElementById('checkInSection');
                const checkOutSection = document.getElementById('checkOutSection');
                const lastUpdate = document.getElementById('lastUpdate');
                
                if (data.is_occupied) {
                    statusDisplay.className = 'status-display occupied';
                    statusDisplay.innerHTML = `
                        <div class="status-icon">🚫</div>
                        <div class="status-text">Dolu</div>
                        <div class="status-info">
                            ${data.current_user ? `👤 ${data.current_user}` : ''}
                            ${data.duration_minutes > 0 ? `<br>⏱️ ${data.duration_minutes} dakika` : ''}
                        </div>
                    `;
                    
                    // Show checkout button only if current user is the one who checked in
                    if (data.current_user === currentUser) {
                        checkInSection.classList.add('hidden');
                        checkOutSection.classList.remove('hidden');
                    } else {
                        checkInSection.classList.add('hidden');
                        checkOutSection.classList.add('hidden');
                    }
                } else {
                    statusDisplay.className = 'status-display available';
                    statusDisplay.innerHTML = `
                        <div class="status-icon">✅</div>
                        <div class="status-text">Müsait</div>
                        <div class="status-info">Kullanıma hazır</div>
                    `;
                    checkInSection.classList.remove('hidden');
                    checkOutSection.classList.add('hidden');
                }
                
                // Update last update time
                const updateTime = new Date(data.last_updated);
                lastUpdate.textContent = updateTime.toLocaleTimeString('tr-TR');
                
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function checkIn() {
            const userName = document.getElementById('userName').value.trim() || 'Anonim';
            
            try {
                const response = await fetch('/api/checkin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ user_name: userName })
                });
                
                if (response.ok) {
                    currentUser = userName;
                    localStorage.setItem('toiletUser', userName);
                    updateStatus();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Giriş yapılamadı');
                }
            } catch (error) {
                console.error('Error checking in:', error);
                alert('Bir hata oluştu');
            }
        }

        async function checkOut() {
            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    currentUser = '';
                    localStorage.removeItem('toiletUser');
                    updateStatus();
                }
            } catch (error) {
                console.error('Error checking out:', error);
                alert('Bir hata oluştu');
            }
        }

        // Pre-fill username if saved
        if (currentUser) {
            document.getElementById('userName').value = currentUser;
        }
    </script>
</body>
</html>
